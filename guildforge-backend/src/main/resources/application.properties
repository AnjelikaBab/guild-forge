spring.application.name=guildforge-backend
server.port=8080

# Data source (override via env in Docker)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/guildforge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:guildforge}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:guildforge}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (set a long random secret in production)
guildforge.jwt.secret=${JWT_SECRET:change-me-to-a-secure-secret-at-least-256-bits-for-hs512}
guildforge.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS (Vite may bind 5173 or the next free port)
guildforge.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
