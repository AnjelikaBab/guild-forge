services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guildforge
      POSTGRES_USER: guildforge
      POSTGRES_PASSWORD: guildforge
    ports:
      - "5432:5432"
    volumes:
      - guildforge-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guildforge -d guildforge"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/guildforge
      SPRING_DATASOURCE_USERNAME: guildforge
      SPRING_DATASOURCE_PASSWORD: guildforge
      JWT_SECRET: dev-only-change-this-to-a-long-random-secret-string
    depends_on:
      db:
        condition: service_healthy

volumes:
  guildforge-pg:
